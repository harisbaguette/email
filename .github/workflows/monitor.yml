name: Mailroom 운영 감시
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: '서비스 변경 없이 실패 알림 경로 점검'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mailroom-monitor
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: HTTPS·DB·예약 작업·보안 이상 점검
        env:
          MAILROOM_MONITOR_TOKEN: ${{ secrets.MAILROOM_MONITOR_TOKEN }}
          ALERT_DRILL: ${{ inputs.drill }}
        run: |
          if [ "$ALERT_DRILL" = "true" ]; then
            node scripts/monitor.mjs --drill
          else
            node scripts/monitor.mjs
          fi
